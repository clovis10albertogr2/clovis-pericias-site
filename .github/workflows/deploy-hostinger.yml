name: Deploy Hostinger

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish
      confirm:
        description: "Para publicar, digite PUBLICAR"
        required: true
        default: "NAO"

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_PROTOCOL: ${{ secrets.HOSTINGER_PROTOCOL }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}

    steps:
      - name: Validar confirmação
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "publish" ] && [ "${{ inputs.confirm }}" != "PUBLICAR" ]; then
            echo "Publicação bloqueada: confirmação inválida."
            exit 1
          fi

      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validar segredos de conexão
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in HOSTINGER_PROTOCOL HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_REMOTE_DIR; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret ausente: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$HOSTINGER_PROTOCOL" in
            ftp|ftps|sftp) ;;
            *)
              echo "::error::HOSTINGER_PROTOCOL deve ser ftp, ftps ou sftp."
              exit 1
              ;;
          esac

          if [ "$HOSTINGER_REMOTE_DIR" = "/" ] || [ "$HOSTINGER_REMOTE_DIR" = "." ]; then
            echo "::error::HOSTINGER_REMOTE_DIR não pode apontar para a raiz genérica do servidor."
            exit 1
          fi

      - name: Instalar lftp
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

      - name: Preparar pacote de produção
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-package
          rsync -a ./ deploy-package/             --exclude='.git/'             --exclude='.github/'             --exclude='README.md'             --exclude='DEPLOY_HOSTINGER.md'

      - name: Simular alterações remotas
        if: ${{ inputs.mode == 'dry-run' }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set sftp:auto-confirm yes
          open -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "$HOSTINGER_PROTOCOL://$HOSTINGER_HOST:$HOSTINGER_PORT"
          mirror --reverse --dry-run --delete --verbose=1             --exclude-glob ".well-known/**"             --exclude-glob ".well-known"             deploy-package "$HOSTINGER_REMOTE_DIR"
          bye
          EOF

      - name: Criar backup remoto
        if: ${{ inputs.mode == 'publish' && inputs.confirm == 'PUBLICAR' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hostinger-backup
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set sftp:auto-confirm yes
          open -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "$HOSTINGER_PROTOCOL://$HOSTINGER_HOST:$HOSTINGER_PORT"
          mirror --verbose=1 "$HOSTINGER_REMOTE_DIR" hostinger-backup
          bye
          EOF

      - name: Salvar backup como artefato
        if: ${{ inputs.mode == 'publish' && inputs.confirm == 'PUBLICAR' }}
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-backup-${{ github.run_number }}
          path: hostinger-backup/
          include-hidden-files: true
          retention-days: 30

      - name: Publicar na Hostinger
        if: ${{ inputs.mode == 'publish' && inputs.confirm == 'PUBLICAR' }}
        shell: bash
        run: |
          set -euo pipefail
          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ssl:verify-certificate yes
          set sftp:auto-confirm yes
          open -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" "$HOSTINGER_PROTOCOL://$HOSTINGER_HOST:$HOSTINGER_PORT"
          mirror --reverse --delete --verbose=1             --exclude-glob ".well-known/**"             --exclude-glob ".well-known"             deploy-package "$HOSTINGER_REMOTE_DIR"
          bye
          EOF

      - name: Resumo
        shell: bash
        run: |
          echo "Modo: ${{ inputs.mode }}"
          if [ "${{ inputs.mode }}" = "publish" ]; then
            echo "Backup criado antes do deploy e retido como artefato por 30 dias."
            echo "Deploy concluído para o diretório remoto configurado."
          else
            echo "Nenhum arquivo remoto foi alterado."
          fi
