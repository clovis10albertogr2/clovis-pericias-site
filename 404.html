<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Página Não Encontrada | Clovis Ribeiro</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #05080f;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .error-container { max-width: 600px; }
    .error-code { font-size: 120px; font-weight: 800; color: #2f7df6; line-height: 1; margin-bottom: 20px; }
    h1 { font-size: 32px; margin-bottom: 15px; }
    p { font-size: 18px; color: #94a3b8; margin-bottom: 40px; }
    .btn {
      display: inline-block;
      padding: 18px 40px;
      background: #2f7df6;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 800;
      transition: 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(47, 125, 246, 0.4); }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Página Não Encontrada</h1>
    <p>A página que você está procurando não existe ou foi movida.</p>
    <a href="/" class="btn">Voltar para o Início</a>
  </div>
</body>
</html>
